[project]
name = "votes-es"
version = "0.0.1"
description = "Open, normalized and provenance-backed records of institutional voting at Spanish listed companies"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.3",
    "pyarrow>=18",
    "httpx>=0.28",
    "lxml>=5",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13",
    "fastapi>=0.115",
    "orjson>=3.10",
    "psutil>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
votes = "votes_es.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/votes_es"]

[tool.hatch.build.targets.wheel.force-include]
"src/votes_es/reference" = "votes_es/reference"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C", "UP", "DTZ", "PYI"]
ignore = ["E501", "C901", "F403"]

[tool.ruff.lint.per-file-ignores]
"src/votes_es/cli/main.py" = ["B008", "DTZ011"]   # Typer defaults are idiomatic
"tests/**" = ["B", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
